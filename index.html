<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aviator Crash Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d16;color:#fff;font-family:Arial,sans-serif}
.app{max-width:430px;margin:auto;min-height:100vh;background:#111827}
header{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;background:#171d2b}
.logo{font-size:20px;font-weight:800}.balance{background:#222b3d;padding:9px 12px;border-radius:20px;color:#ffd54a;font-weight:bold}
.game{margin:12px;background:#090d16;border-radius:18px;overflow:hidden;position:relative;height:300px;border:1px solid #293247}
canvas{width:100%;height:100%}.mult{position:absolute;left:0;right:0;top:80px;text-align:center;font-size:52px;font-weight:900;text-shadow: 0 0 10px rgba(255,255,255,0.2)}
.status{position:absolute;top:145px;width:100%;text-align:center;color:#aab4c8;font-weight:600}
.panel{padding:14px}.row{display:flex;gap:10px}.box{flex:1;background:#1b2333;border-radius:14px;padding:12px}
label{font-size:12px;color:#9ca8bb;display:block;margin-bottom:7px}
input{width:100%;background:#0d1320;color:white;border:1px solid #34405a;border-radius:10px;padding:12px;font-size:16px;font-weight:bold}
button{border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;transition:0.2s}
.bet{background:#10b981;color:#fff;flex:1}.cash{background:#f59e0b;color:#fff;flex:1}
button:disabled{opacity:.3;cursor:not-allowed}.history{margin-top:12px;background:#1b2333;border-radius:14px;padding:12px}
.history h3{margin:0 0 9px;font-size:13px;color:#9ca8bb}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#263149;padding:6px 10px;border-radius:8px;font-size:12px;color:#38bdf8;font-weight:bold}
.note{text-align:center;color:#6b7280;font-size:11px;padding:12px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🚀 AVIATOR DEMO</div><div class="balance">🪙 <span id="balance">10000</span></div></header>
<div class="game"><canvas id="c"></canvas><div class="mult" id="mult">1.00x</div><div class="status" id="status">Place your virtual bet</div></div>
<div class="panel">
<div class="row">
<div class="box"><label>BET (virtual coins)</label><input id="bet" type="number" min="1" max="1000" value="10"></div>
<div class="box"><label>PAYOUT</label><input id="payout" value="0" disabled></div>
</div>
<div class="row" style="margin-top:10px"><button class="bet" id="betBtn">BET 10</button><button class="cash" id="cashBtn" disabled>CASH OUT</button></div>
<div class="history"><h3>Previous rounds</h3><div class="chips" id="history"></div></div>
</div>
<div class="note">Demo only • Uses virtual coins • No real money</div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const multEl=document.getElementById('mult'),statusEl=document.getElementById('status');
const balEl=document.getElementById('balance'),betEl=document.getElementById('bet'),payoutEl=document.getElementById('payout');
const betBtn=document.getElementById('betBtn'),cashBtn=document.getElementById('cashBtn'),hist=document.getElementById('history');
let balance=10000, bet=10, running=false, crashed=false, cashed=false, m=1, crashAt=0, start=0, raf;

function resize(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize); resize();

function draw(t){
 const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);
 
 // Grid lines
 ctx.strokeStyle='#1a2332';ctx.lineWidth=1;
 for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
 for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
 
 if(running || crashed){
   const p=Math.min(1,(t-start)/6000);
   const x=20+p*(w-50);
   const y=h-20-p*(h-60);
   
   // Red area under plane curve
   ctx.fillStyle='rgba(239, 68, 68, 0.15)';
   ctx.beginPath();
   ctx.moveTo(20, h-20);
   ctx.quadraticCurveTo(w*0.4, h*0.8, x, y);
   ctx.lineTo(x, h-20);
   ctx.closePath();
   ctx.fill();

   // Curve line
   ctx.strokeStyle='#ef4444';
   ctx.lineWidth=4;
   ctx.beginPath();
   ctx.moveTo(20,h-20);
   ctx.quadraticCurveTo(w*0.4,h*0.8,x,y);
   ctx.stroke();
   
   // Bright Red Aviator Plane Icon
   if(running){
     ctx.save();
     ctx.translate(x, y);
     ctx.rotate(-Math.PI / 6); // Plane tilt angle
     ctx.font='bold 28px Arial';
     ctx.fillStyle='#ff2a2a';
     ctx.shadowColor='#ff0000';
     ctx.shadowBlur=12;
     ctx.fillText('✈', -12, 10);
     ctx.restore();
   }
 }
}

function update(){
 balEl.textContent=balance.toFixed(0);
 payoutEl.value=cashed?((bet*m).toFixed(0)):0;
 betBtn.textContent='BET '+Math.min(1000,Math.max(1,+betEl.value||1));
}
betEl.oninput=update;

function newRound(){
 running=true;crashed=false;cashed=false;m=1;start=performance.now();
 crashAt=1.15+Math.random()*8.0;
 statusEl.textContent='Flying...';
 statusEl.style.color='#aab4c8';
 cashBtn.disabled=false;
 betBtn.disabled=true;

 function frame(t){
   if(!running) return;
   const sec=(t-start)/1000;
   m=1+sec*0.35+sec*sec*0.04;

   if(m>=crashAt){
     m=crashAt;
     running=false;
     crashed=true;
     cashBtn.disabled=true;
     betBtn.disabled=false;
     statusEl.textContent='💥 FLEW AWAY (CRASHED)';
     statusEl.style.color='#ef4444';
     addHistory(m);
     draw(t);
     multEl.textContent=m.toFixed(2)+'x';
     return;
   }
   multEl.textContent=m.toFixed(2)+'x';
   draw(t);
   raf=requestAnimationFrame(frame);
 }
 raf=requestAnimationFrame(frame);
}

betBtn.onclick=()=>{
 if(running) return;
 bet=Math.floor(+betEl.value||0);
 if(bet<1||bet>1000){alert('Bet 1 to 1000 virtual coins.');return}
 if(bet>balance){alert('Not enough virtual coins.');return}
 balance-=bet;
 update();
 newRound();
}

cashBtn.onclick=()=>{
 if(!running||cashed) return;
 cashed=true;
 running=false;
 cancelAnimationFrame(raf);
 cashBtn.disabled=true;
 betBtn.disabled=false;
 const win=Math.floor(bet*m);
 balance+=win;
 statusEl.textContent='✅ Cashed out at '+m.toFixed(2)+'x';
 statusEl.style.color='#10b981';
 update();
 addHistory(m);
 draw(performance.now());
}

function addHistory(x){
 const d=document.createElement('span');
 d.className='chip';
 d.textContent=x.toFixed(2)+'x';
 hist.prepend(d);
 while(hist.children.length>8)hist.lastChild.remove();
}

update();
draw(0);
</script>
</body>
</html>
