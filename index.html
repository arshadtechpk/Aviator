<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Data Portal</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-green: #00e676;
            --accent-red: #ff1744;
            --text-main: #ffffff;
            --text-sub: #90a4ae;
            --border-color: #242b35;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-green);
            font-size: 22px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1e2530;
            color: var(--text-sub);
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active-deposit {
            background: var(--accent-green);
            color: #000;
        }

        .tab-btn.active-withdraw {
            background: var(--accent-red);
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-sub);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0b0e14;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-deposit {
            background: var(--accent-green);
            color: #000;
        }

        .btn-withdraw {
            background: var(--accent-red);
            color: #fff;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Aviator Management</h2>

    <div class="tab-buttons">
        <button class="tab-btn active-deposit" id="deposit-tab" onclick="switchTab('deposit')">Deposit</button>
        <button class="tab-btn" id="withdraw-tab" onclick="switchTab('withdraw')">Withdrawal</button>
    </div>

    <form id="data-form" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
            <label for="username">User Name / ID</label>
            <input type="text" id="username" placeholder="e.g. Arshad123" required>
        </div>

        <div class="form-group">
            <label for="amount">Amount (PKR)</label>
            <input type="number" id="amount" placeholder="e.g. 1000" required>
        </div>

        <div class="form-group">
            <label for="method">Payment Method</label>
            <select id="method" required>
                <option value="Easypaisa">Easypaisa</option>
                <option value="JazzCash">JazzCash</option>
                <option value="Bank Transfer">Bank Transfer</option>
            </select>
        </div>

        <div class="form-group">
            <label id="account-label" for="accountOrTid">Transaction ID (TID)</label>
            <input type="text" id="accountOrTid" placeholder="Enter TID" required>
        </div>

        <div class="form-group" id="title-group">
            <label for="accountTitle">Account Title</label>
            <input type="text" id="accountTitle" placeholder="Account Title Name">
        </div>

        <button type="submit" id="submit-btn" class="submit-btn btn-deposit">Submit Deposit</button>
    </form>

    <div id="status-msg"></div>
</div>

<script>
    // Configured Google Sheet Web App URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBmbTqpAhf90v6lK4MhGEmkuEjhWimRyzPI7s_gxoGwHnNuAIUaKGTdjaYLMez8bKhJA/exec";
    
    let currentType = 'deposit';

    function switchTab(type) {
        currentType = type;
        const depTab = document.getElementById('deposit-tab');
        const withTab = document.getElementById('withdraw-tab');
        const submitBtn = document.getElementById('submit-btn');
        const accountLabel = document.getElementById('account-label');
        const titleGroup = document.getElementById('title-group');

        if (type === 'deposit') {
            depTab.className = 'tab-btn active-deposit';
            withTab.className = 'tab-btn';
            submitBtn.className = 'submit-btn btn-deposit';
            submitBtn.innerText = 'Submit Deposit';
            accountLabel.innerText = 'Transaction ID (TID)';
            document.getElementById('accountOrTid').placeholder = 'Enter TID';
            titleGroup.style.display = 'block';
        } else {
            withTab.className = 'tab-btn active-withdraw';
            depTab.className = 'tab-btn';
            submitBtn.className = 'submit-btn btn-withdraw';
            submitBtn.innerText = 'Submit Withdrawal Request';
            accountLabel.innerText = 'Withdraw Account Number';
            document.getElementById('accountOrTid').placeholder = 'Enter Account Number';
            titleGroup.style.display = 'block';
        }
    }

    async function handleFormSubmit(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-msg');

        const payload = {
            type: currentType.toUpperCase(),
            user: document.getElementById('username').value,
            amount: document.getElementById('amount').value,
            method: document.getElementById('method').value,
            accountOrTid: document.getElementById('accountOrTid').value,
            title: document.getElementById('accountTitle').value
        };

        submitBtn.disabled = true;
        statusMsg.style.color = '#ffeb3b';
        statusMsg.innerText = 'Saving to Google Sheet...';

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            statusMsg.style.color = '#00e676';
            statusMsg.innerText = 'Data Successfully Saved to Google Sheet!';
            document.getElementById('data-form').reset();
            switchTab(currentType);

        } catch (error) {
            statusMsg.style.color = '#ff1744';
            statusMsg.innerText = 'Error saving data. Please check connection.';
            console.error('Error:', error);
        } finally {
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
