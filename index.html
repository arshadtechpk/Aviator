<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Game & Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0e14; color: #fff; padding: 10px; display: flex; justify-content: center; }
        .main-container { width: 100%; max-width: 480px; background: #151a23; border-radius: 12px; padding: 15px; border: 1px solid #242b35; }
        
        /* Top Navigation */
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e2530; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; }
        .balance-box { font-size: 16px; font-weight: bold; color: #00e676; }
        
        /* Game Screen */
        .game-screen { position: relative; width: 100%; height: 220px; background: radial-gradient(circle, #1a2230 0%, #0b0e14 100%); border-radius: 10px; border: 1px solid #242b35; overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .multiplier { font-size: 42px; font-weight: bold; color: #fff; z-index: 2; }
        .plane { position: absolute; bottom: 20px; left: 20px; font-size: 32px; transition: transform 0.1s linear; display: none; }
        .crashed-text { color: #ff1744; font-size: 20px; font-weight: bold; position: absolute; bottom: 30px; display: none; }
        
        /* Betting Section */
        .bet-section { display: flex; gap: 10px; margin-bottom: 15px; }
        .bet-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #242b35; background: #0b0e14; color: #fff; font-size: 16px; text-align: center; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-bet { background: #00e676; color: #000; }
        .btn-cashout { background: #ffb300; color: #000; display: none; }

        /* Banking Tabs & Form */
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; border-top: 1px solid #242b35; padding-top: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; background: #1e2530; color: #90a4ae; font-weight: bold; cursor: pointer; }
        .tab-btn.active-dep { background: #00e676; color: #000; }
        .tab-btn.active-with { background: #ff1744; color: #fff; }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: #90a4ae; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #242b35; background: #0b0e14; color: #fff; }
        
        .submit-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        #status-msg { text-align: center; font-size: 13px; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Header -->
    <div class="header">
        <span style="font-size: 18px; font-weight: bold; color: #ff1744;">✈️ AVIATOR</span>
        <div class="balance-box">Balance: <span id="user-balance">1000</span> PKR</div>
    </div>

    <!-- Game Canvas -->
    <div class="game-screen">
        <div class="multiplier" id="multiplier">1.00x</div>
        <div class="plane" id="plane">🚀</div>
        <div class="crashed-text" id="crashed-text">FLEW AWAY!</div>
    </div>

    <!-- Bet Controls -->
    <div class="bet-section">
        <input type="number" id="bet-amount" class="bet-input" value="100" min="10">
        <button id="bet-btn" class="action-btn btn-bet" onclick="placeBet()">BET</button>
        <button id="cashout-btn" class="action-btn btn-cashout" onclick="cashOut()">CASHOUT</button>
    </div>

    <!-- Deposit & Withdrawal Section -->
    <div class="tabs">
        <button class="tab-btn active-dep" id="dep-tab" onclick="switchTab('deposit')">Deposit</button>
        <button class="tab-btn" id="with-tab" onclick="switchTab('withdraw')">Withdraw</button>
    </div>

    <form id="bank-form" onsubmit="handleBankSubmit(event)">
        <div class="form-group">
            <label>Username / Account Name</label>
            <input type="text" id="bank-user" placeholder="Enter name" required>
        </div>
        <div class="form-group">
            <label>Amount (PKR)</label>
            <input type="number" id="bank-amount" placeholder="Enter amount" required>
        </div>
        <div class="form-group">
            <label>Payment Method</label>
            <select id="bank-method">
                <option value="Easypaisa">Easypaisa</option>
                <option value="JazzCash">JazzCash</option>
                <option value="Bank">Bank Transfer</option>
            </select>
        </div>
        <div class="form-group">
            <label id="tid-label">Transaction ID (TID)</label>
            <input type="text" id="bank-tid" placeholder="Enter TID" required>
        </div>
        <button type="submit" id="form-submit-btn" class="submit-btn" style="background:#00e676; color:#000;">Submit Deposit Request</button>
    </form>
    <div id="status-msg"></div>
</div>

<script>
    // Configured Google Sheet Web App URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBmbTqpAhf90v6lK4MhGEmkuEjhWimRyzPI7s_gxoGwHnNuAIUaKGTdjaYLMez8bKhJA/exec";

    // Game Logic
    let balance = 1000;
    let currentMultiplier = 1.00;
    let gameInterval;
    let isPlaying = false;
    let betAmount = 0;
    let crashPoint = 0;

    function updateBalanceDisplay() {
        document.getElementById('user-balance').innerText = balance.toFixed(2);
    }

    function placeBet() {
        let inputVal = parseFloat(document.getElementById('bet-amount').value);
        if (isNaN(inputVal) || inputVal > balance || inputVal <= 0) {
            alert('Invalid or Insufficient Balance!');
            return;
        }

        betAmount = inputVal;
        balance -= betAmount;
        updateBalanceDisplay();

        isPlaying = true;
        document.getElementById('bet-btn').style.display = 'none';
        document.getElementById('cashout-btn').style.display = 'block';
        document.getElementById('crashed-text').style.display = 'none';

        startFly();
    }

    function startFly() {
        currentMultiplier = 1.00;
        crashPoint = (Math.random() * 4 + 1.1).toFixed(2); // Random crash point between 1.1x and 5x
        
        const plane = document.getElementById('plane');
        const multDisplay = document.getElementById('multiplier');
        plane.style.display = 'block';

        let posX = 20, posY = 20;

        gameInterval = setInterval(() => {
            currentMultiplier += 0.03;
            multDisplay.innerText = currentMultiplier.toFixed(2) + 'x';

            posX += 2;
            posY += 1.2;
            plane.style.transform = `translate(${posX}px, -${posY}px)`;

            if (currentMultiplier >= crashPoint) {
                gameOver(false);
            }
        }, 100);
    }

    function cashOut() {
        if (!isPlaying) return;
        let winAmount = betAmount * currentMultiplier;
        balance += winAmount;
        updateBalanceDisplay();
        alert(`You Cashed Out at ${currentMultiplier.toFixed(2)}x! Won: ${winAmount.toFixed(2)} PKR`);
        gameOver(true);
    }

    function gameOver(isWin) {
        clearInterval(gameInterval);
        isPlaying = false;

        document.getElementById('plane').style.display = 'none';
        document.getElementById('plane').style.transform = 'translate(0px, 0px)';
        document.getElementById('cashout-btn').style.display = 'none';
        document.getElementById('bet-btn').style.display = 'block';

        if (!isWin) {
            document.getElementById('crashed-text').style.display = 'block';
            document.getElementById('multiplier').innerText = '1.00x';
        }
    }

    // Banking Logic (Deposit / Withdraw Integration)
    let currentBankType = 'deposit';

    function switchTab(type) {
        currentBankType = type;
        const depTab = document.getElementById('dep-tab');
        const withTab = document.getElementById('with-tab');
        const submitBtn = document.getElementById('form-submit-btn');
        const tidLabel = document.getElementById('tid-label');

        if (type === 'deposit') {
            depTab.className = 'tab-btn active-dep';
            withTab.className = 'tab-btn';
            submitBtn.style.background = '#00e676';
            submitBtn.style.color = '#000';
            submitBtn.innerText = 'Submit Deposit Request';
            tidLabel.innerText = 'Transaction ID (TID)';
        } else {
            withTab.className = 'tab-btn active-with';
            depTab.className = 'tab-btn';
            submitBtn.style.background = '#ff1744';
            submitBtn.style.color = '#fff';
            submitBtn.innerText = 'Submit Withdraw Request';
            tidLabel.innerText = 'Withdraw Account Number';
        }
    }

    async function handleBankSubmit(event) {
        event.preventDefault();
        const statusMsg = document.getElementById('status-msg');
        statusMsg.style.color = '#ffb300';
        statusMsg.innerText = 'Sending request to Google Sheet...';

        const payload = {
            type: currentBankType.toUpperCase(),
            user: document.getElementById('bank-user').value,
            amount: document.getElementById('bank-amount').value,
            method: document.getElementById('bank-method').value,
            accountOrTid: document.getElementById('bank-tid').value
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            statusMsg.style.color = '#00e676';
            statusMsg.innerText = 'Request Sent & Saved to Google Sheet Successfully!';
            document.getElementById('bank-form').reset();
        } catch (err) {
            statusMsg.style.color = '#ff1744';
            statusMsg.innerText = 'Failed to send data.';
        }
    }
</script>

</body>
</html>
