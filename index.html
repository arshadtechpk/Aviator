<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: white; padding: 20px; text-align: center; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #1e293b; border-radius: 8px; margin-bottom: 20px; }
    .btn { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-alt { background: #3b82f6; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: left; }
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; background: #334155; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .tab-btn.active { background: #22c55e; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <h2>🚀 AVIATOR PRO</h2>
    <div id="auth-section">
      <button class="btn" id="login-btn">Login / Register</button>
    </div>
    <div id="user-section" style="display: none;">
      <span style="color:#22c55e; font-weight:bold;">PKR <span id="balance">0.00</span></span>
    </div>
  </div>

  <!-- Wallet Section (Tabs) -->
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-dep-btn">Deposit</button>
      <button class="tab-btn" id="tab-wit-btn">Withdraw</button>
    </div>

    <!-- Deposit Form -->
    <form id="deposit-form">
      <h3>Deposit Funds</h3>
      <br>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="dep-username" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <select id="dep-method">
          <option value="easypaisa">EasyPaisa</option>
          <option value="jazzcash">JazzCash</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount (PKR)</label>
        <input type="number" id="dep-amount" placeholder="Min 100" required>
      </div>
      <div class="form-group">
        <label>Transaction ID (TID)</label>
        <input type="text" id="dep-tid" placeholder="TID Number" required>
      </div>
      <button type="submit" class="btn" style="width:100%;">Submit Deposit</button>
    </form>

    <!-- Withdraw Form -->
    <form id="withdraw-form" style="display: none;">
      <h3>Withdraw Funds</h3>
      <br>
      <div class="form-group">
        <label>Account Number</label>
        <input type="text" placeholder="03XXXXXXXXX" required>
      </div>
      <div class="form-group">
        <label>Amount (PKR)</label>
        <input type="number" placeholder="Min 500" required>
      </div>
      <button type="submit" class="btn btn-alt" style="width:100%;">Request Withdraw</button>
    </form>
  </div>

  <!-- Auth Modal (Popup) -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>
      
      <div class="tabs">
        <button class="tab-btn active" id="tab-login-btn">Login</button>
        <button class="tab-btn" id="tab-signup-btn">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">Login</button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" style="display: none;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signup-username" required>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" id="signup-phone" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" required>
        </div>
        <button type="submit" class="btn btn-alt" style="width:100%;">Create Account</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
