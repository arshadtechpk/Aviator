<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Pro Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-card">
    
    <!-- Header Section -->
    <header class="navbar">
      <div class="brand">
        <span class="plane-icon">✈️</span>
        <span class="logo-text">AVIATOR <small>PRO</small></span>
      </div>
      <div class="wallet-badge">
        <span class="currency-label">PKR</span>
        <span class="balance" id="balance">1,066.00</span>
      </div>
    </header>

    <!-- Game Screen / Multiplier Area -->
    <div class="game-viewport">
      <div class="multiplier-display">
        <span id="multiplier">1.66</span><small>x</small>
      </div>
      <div class="status-badge">FLYING HIGH</div>
    </div>

    <!-- Quick Bet Section -->
    <div class="bet-container">
      <div class="input-wrapper">
        <span class="currency-tag">PKR</span>
        <input type="number" id="bet-amount" value="100" step="10">
      </div>
      <button class="btn-primary btn-bet">PLACE BET</button>
    </div>

    <!-- Aviator Management Section -->
    <div class="management-card">
      <h3 class="card-title">AVIATOR MANAGEMENT</h3>

      <!-- Deposit / Withdrawal Tabs -->
      <div class="tab-segment">
        <button type="button" class="tab-btn active" id="btn-tab-deposit" onclick="switchTab('deposit')">Deposit</button>
        <button type="button" class="tab-btn" id="btn-tab-withdraw" onclick="switchTab('withdraw')">Withdrawal</button>
      </div>

      <!-- Deposit Form -->
      <form id="deposit-form" class="pro-form">
        <div class="form-group">
          <label>USER NAME / ID</label>
          <input type="text" placeholder="e.g. Arshad123" required>
        </div>

        <div class="form-group">
          <label>AMOUNT (PKR)</label>
          <input type="number" placeholder="e.g. 1000" required>
        </div>

        <div class="form-group">
          <label>PAYMENT METHOD</label>
          <div class="select-wrapper">
            <select>
              <option value="easypaisa">Easypaisa</option>
              <option value="jazzcash">JazzCash</option>
              <option value="bank">Bank Transfer</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>TRANSACTION ID (TID)</label>
          <input type="text" placeholder="Enter 11-digit TID" required>
        </div>

        <button type="submit" class="btn-action btn-deposit">SUBMIT DEPOSIT</button>
      </form>

      <!-- Withdraw Form (Initially Hidden) -->
      <form id="withdraw-form" class="pro-form" style="display: none;">
        <div class="form-group">
          <label>USER NAME / ID</label>
          <input type="text" placeholder="e.g. Arshad123" required>
        </div>

        <div class="form-group">
          <label>WITHDRAW AMOUNT (PKR)</label>
          <input type="number" placeholder="e.g. 500" required>
        </div>

        <div class="form-group">
          <label>ACCOUNT / MOBILE NUMBER</label>
          <input type="text" placeholder="03XXXXXXXXX" required>
        </div>

        <button type="submit" class="btn-action btn-withdraw">SUBMIT WITHDRAWAL</button>
      </form>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
