<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Header Navigation Bar */
        .header {
            background-color: #151d2a;
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #202b3c;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .login-btn {
            background-color: #00c853;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        /* Main Form Card */
        .card {
            background-color: #151d2a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #202b3c;
        }

        /* Deposit / Withdraw Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.deposit {
            background-color: #00c853;
            color: #ffffff;
        }

        .tab-btn.withdraw {
            background-color: #243044;
            color: #8f9cae;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        /* Input Form Controls */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #b0bec5;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background-color: #0b111e;
            border: 1px solid #2d3b50;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: #00c853;
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b0bec5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        .submit-btn {
            width: 100%;
            background-color: #00c853;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background-color: #00b04a;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navbar -->
        <header class="header">
            <div class="logo">
                🚀 AVIATOR PRO
            </div>
            <button class="login-btn">Login / Register</button>
        </header>

        <!-- Form Card -->
        <div class="card">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn deposit">Deposit</button>
                <button class="tab-btn withdraw">Withdraw</button>
            </div>

            <h2 class="card-title">Deposit Funds</h2>

            <!-- Deposit Form (novalidate stops browser popup) -->
            <form id="depositForm" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="payment">Payment Method</label>
                    <select id="payment" class="form-control">
                        <option value="EasyPaisa">EasyPaisa</option>
                        <option value="JazzCash">JazzCash</option>
                        <option value="BankTransfer">Bank Transfer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (PKR)</label>
                    <input type="number" id="amount" class="form-control" placeholder="Min 100">
                </div>

                <div class="form-group">
                    <label for="tid">Transaction ID (TID)</label>
                    <input type="text" id="tid" class="form-control" placeholder="TID Number">
                </div>

                <button type="submit" class="submit-btn">Submit Deposit</button>
            </form>
        </div>
    </div>

    <script>
        // Form Validation Logic (JavaScript)
        document.getElementById('depositForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let username = document.getElementById('username').value.trim();
            let amount = document.getElementById('amount').value.trim();
            let tid = document.getElementById('tid').value.trim();

            if (!username) {
                alert('Barae karam Apna Username darj karein!');
                return;
            }

            if (!amount || amount < 100) {
                alert('Barae karam kam az kam 100 PKR ki rakam likhein!');
                return;
            }

            if (!tid) {
                alert('Barae karam Transaction ID (TID) darj karein!');
                return;
            }

            alert('Aap ki Deposit request bhej di gayi hai!');
            // Yahan apna backend API call add kar sakte hain
        });
    </script>

</body>
</html>
